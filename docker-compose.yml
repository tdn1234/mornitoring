services:
  redis:
    image: redis:7
    ports:
      - "6380:6379"

  api:
    image: python:3.11
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install fastapi uvicorn redis rq pydantic && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"

  worker:
    image: python:3.11
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install redis rq && python worker/worker.py"